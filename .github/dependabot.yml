# Dependency updates, proposed rather than applied. Everything npm installs
# here is a build, test or lint tool (main.js bundles none of it), and the
# actions run in CI. Minor and patch updates come once a week in one pull
# request per ecosystem; security updates as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The obsidian package pins the exact CodeMirror versions the app ships
      # (npm ERESOLVE otherwise); they move only together with obsidian. Both
      # are build-time types: Obsidian provides CodeMirror at run time and
      # main.js bundles none of it.
      - dependency-name: '@codemirror/state'
      - dependency-name: '@codemirror/view'
      # Node types follow the Node inside Obsidian's Electron, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler) waits until typescript-eslint and
      # the Obsidian lint rules support it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
